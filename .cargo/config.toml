[env]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"

# A `pyo3` `extension-module` cdylib does not link libpython; on macOS the undefined CPython
# symbols must be resolved at load time by the interpreter instead. maturin passes this for its
# own builds, so it is only needed for a plain `cargo build --features python`.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
