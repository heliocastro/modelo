# Publishes the `modelo` (library) and `modelo-cli` (the `modelo` binary) crates to crates.io.
# Triggered only by a `v*` tag or a manual dispatch.
#
# The verify job packages each crate exactly as it would be uploaded and runs the test suite
# against the workspace; publish runs only if that passes. `modelo` is published before
# `modelo-cli` since the latter depends on it, with a short pause for the crates.io index to
# pick up the new version before the dependent crate is verified server-side. Authentication uses
# a crates.io API token in the `CARGO_REGISTRY_TOKEN` secret, scoped to the `crates-io`
# environment.

name: Release (crates.io)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo test --locked --workspace --all-targets
      # Builds each crate from its packaged tarball, catching files missing from the published
      # artifact (a `cargo test` on the working tree would not).
      - run: cargo package --locked -p modelo
      # modelo-cli depends on modelo by path+version; it can only be verified against the
      # not-yet-published registry version, so skip the verify build here.
      - run: cargo package --locked -p modelo-cli --no-verify

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - run: cargo publish --locked -p modelo
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Give crates.io's index a moment to expose the just-published `modelo` version before
      # `modelo-cli` (which depends on it) is published.
      - run: sleep 30
      - run: cargo publish --locked -p modelo-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
