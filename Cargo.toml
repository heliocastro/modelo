[package]
name = "vale"
version = "0.3.1"
edition = "2021"
description = "Validation Extended - ORT model validation, a Rust port of python-ort"
license = "MIT"
repository = "https://github.com/heliocastro/vale"
readme = "README.md"
keywords = ["ort", "sbom", "spdx", "validation"]
categories = ["parser-implementations"]
exclude = ["examples/*.py", ".github/*"]

[lib]
name = "vale"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "vale"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }
purl = { version = "0.1", features = ["serde", "package-type"] }

[features]
python = ["dep:pyo3"]
