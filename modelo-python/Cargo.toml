[package]
name = "modelo-python"
version = "0.9.0"
edition = "2024"
description = "Python bindings for modelo, built with pyo3/maturin"
license = "MIT"
repository = "https://github.com/heliocastro/modelo"
publish = false

[lib]
name = "_modelo"
crate-type = ["cdylib"]

[dependencies]
modelo = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
