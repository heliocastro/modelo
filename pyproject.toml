[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "vale"
version = "0.3.1"
description = "Validation Extended - ORT model validation in Rust, with python-ort compatible bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Helio Chissini de Castro", email = "dev@heliocastro.info" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/heliocastro/vale"

[tool.maturin]
module-name = "vale._vale"
python-source = "python"
features = ["python"]
include = ["python/vale/py.typed", "python/vale/*.pyi"]
