[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "python-modelo"
version = "0.8.0"
description = "Modelo - A modular model validator, with python-ort compatible bindings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Helio Chissini de Castro", email = "dev@heliocastro.info" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/heliocastro/modelo"

[tool.maturin]
manifest-path = "modelo-python/Cargo.toml"
module-name = "modelo._modelo"
python-source = "python"
include = ["python/modelo/py.typed", "python/modelo/*.pyi"]
